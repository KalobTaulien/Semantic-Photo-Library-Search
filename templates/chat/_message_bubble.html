<div class="flex {% if message.role == 'user' %}justify-end{% else %}justify-start{% endif %}">
    <div class="max-w-2xl rounded-lg px-4 py-2 text-sm {% if message.role == 'user' %}bg-gray-900 text-white{% else %}bg-gray-100 text-gray-900{% endif %}">
        <p>{{ message.content }}</p>
        {% if message.role == 'assistant' and message.photos %}
            <div class="mt-3">
                {% include "photos/_gallery.html" with photos=message.photos %}
            </div>
        {% endif %}
    </div>
</div>
