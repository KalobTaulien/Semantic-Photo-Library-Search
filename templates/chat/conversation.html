{% extends "base.html" %}

{% block title %}Chat{% endblock %}

{% block content %}
<div class="flex h-[70vh] flex-col">
    <div id="message-list" class="flex-1 space-y-4 overflow-y-auto pr-2">
        {% for message in chat_messages %}
            {% include "chat/_message_bubble.html" %}
        {% empty %}
            <p class="text-sm text-gray-500">
                Ask about your photos &mdash; e.g. &ldquo;show me photos from the beach&rdquo;.
            </p>
        {% endfor %}
    </div>

    <form hx-post="{% url 'chat:send_message' conversation.pk %}"
          hx-target="#message-list"
          hx-swap="beforeend"
          hx-on::after-request="this.reset()"
          class="mt-4 flex gap-2 border-t border-gray-200 pt-4">
        {% csrf_token %}
        <input type="text" name="content" required autocomplete="off"
               placeholder="Ask about your photos..."
               class="flex-1 rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-gray-500 focus:outline-none">
        <button type="submit" class="rounded-md bg-gray-900 px-4 py-2 text-sm font-medium text-white hover:bg-gray-700">
            Send
        </button>
    </form>
</div>
{% endblock %}
